services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - webhook
    restart: unless-stopped

  webhook:
    build: .
    # Not published to the host — Caddy is the only public entry point,
    # over HTTPS (TradingView refuses plain HTTP webhook URLs). Reach it
    # locally for testing via `docker compose exec webhook curl ...` or
    # temporarily add "127.0.0.1:8080:8080" here.
    environment:
      - RUN_MONITOR_IN_PROCESS=false
      - POSITIONS_FILE=/app/data/positions.json
    env_file:
      - .env
    volumes:
      - positions-data:/app/data
    restart: unless-stopped

  monitor:
    build: .
    command: ["python3", "monitor.py"]
    environment:
      - POSITIONS_FILE=/app/data/positions.json
    env_file:
      - .env
    volumes:
      - positions-data:/app/data
    restart: unless-stopped

volumes:
  positions-data:
  caddy-data:
  caddy-config:
